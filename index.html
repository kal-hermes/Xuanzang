<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xuanzang — History &amp; Geography Learning</title>
<link rel="stylesheet" href="css/app.css?v=18">
</head>
<body>
<header id="app-header">
  <h1 id="app-title">Xuanzang</h1>
  <div class="controls">
    <label>
      <span data-i18n="lesson"></span>
      <select id="lesson-select"></select>
    </label>
    <label>
      <span data-i18n="mode"></span>
      <select id="mode-select">
        <option value="learn" data-i18n="mode_learn"></option>
        <option value="locate" data-i18n="mode_locate"></option>
        <option value="name" data-i18n="mode_name"></option>
        <option value="route" data-i18n="mode_route"></option>
        <option value="sights" data-i18n="mode_sights"></option>
      </select>
    </label>
    <label id="journey-view-row" hidden>
      <span data-i18n="view"></span>
      <select id="journey-view-select">
        <option value="explore" data-i18n="view_explore"></option>
        <option value="step" data-i18n="view_step"></option>
      </select>
    </label>
    <label>
      <span data-i18n="language"></span>
      <select id="locale-select">
        <option value="en-GB">English (British)</option>
        <option value="fr-CA">Français (Canada)</option>
        <option value="zh-Hans">简体中文</option>
        <option value="zh-HK">繁體中文（香港）</option>
        <option value="ja">日本語</option>
      </select>
    </label>
    <label>
      <span data-i18n="projection"></span>
      <select id="projection-select">
        <option value="equirectangular" data-i18n="proj_equirectangular"></option>
        <option value="mercator" data-i18n="proj_mercator"></option>
        <option value="naturalEarth" data-i18n="proj_naturalEarth"></option>
        <option value="robinson" data-i18n="proj_robinson"></option>
        <option value="globe" data-i18n="proj_globe"></option>
      </select>
    </label>
    <label id="answer-style-row" hidden>
      <span data-i18n="answer_style"></span>
      <select id="answer-style-select">
        <option value="choice" data-i18n="answer_choice"></option>
        <option value="text" data-i18n="answer_text"></option>
      </select>
    </label>
  </div>
</header>

<main>
  <aside id="country-list-panel" hidden>
    <h2 data-i18n="countries"></h2>
    <ul id="country-list"></ul>
  </aside>
  <section id="stage">
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    <button id="reset-view-button" data-i18n="reset_view" title=""></button>
    <div id="prompt-bar" hidden>
      <div id="journey-controls" hidden>
        <button id="journey-prev" data-i18n="prev_stop" hidden></button>
        <span id="journey-counter"></span>
        <button id="journey-next" data-i18n="next_stop" hidden></button>
      </div>
      <span id="prompt-text"></span>
      <span id="score-display"></span>
      <button id="reveal-button" data-i18n="reveal_answer" hidden></button>
      <button id="restart-button" data-i18n="restart"></button>
    </div>
    <div id="answer-box" hidden>
      <div id="choices"></div>
      <form id="text-form" hidden>
        <input id="text-input" type="text" autocomplete="off" spellcheck="false">
        <button type="submit" data-i18n="submit"></button>
      </form>
    </div>
  </section>

  <aside id="info-panel" hidden>
    <button id="info-close" data-i18n="close" aria-label="close">×</button>
    <h2 id="info-name"></h2>
    <dl id="info-facts"></dl>
  </aside>
</main>

<footer id="hint-bar"><span id="hint-text"></span></footer>

<script src="js/vendor/topojson-client.min.js?v=3"></script>
<script src="js/vendor/d3-array.min.js?v=3"></script>
<script src="js/vendor/d3-path.min.js?v=3"></script>
<script src="js/vendor/d3-geo.min.js?v=3"></script>
<script src="js/vendor/d3-geo-projection.min.js?v=1"></script>
<script src="js/vendor/versor.min.js?v=1"></script>
<script src="js/i18n.js?v=16"></script>
<!-- script-tag data: makes the app loadable from file:// (fetch of
     local files is blocked there); .json originals remain the source
     of truth, regenerated by tools/gen_js_data.py -->
<script src="geo/world-data.js?v=2"></script>
<script src="data/qid-map.js?v=2"></script>
<script src="data/capital-coords.js?v=1"></script>
<script src="lessons/examples/europe-countries.js?v=1"></script>
<script src="lessons/examples/asia-countries.js?v=1"></script>
<script src="lessons/examples/africa-countries.js?v=1"></script>
<script src="lessons/examples/north-america-countries.js?v=1"></script>
<script src="lessons/examples/south-america-countries.js?v=1"></script>
<script src="lessons/examples/oceania-countries.js?v=1"></script>
<script src="lessons/xuanzang/journey.js?v=6"></script>
<script src="lessons/magellan/voyage.js?v=19"></script>
<script src="js/facts.js?v=9"></script>
<script src="js/map.js?v=60"></script>
<script src="js/app.js?v=33"></script>
</body>
</html>
