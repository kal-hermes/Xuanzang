<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas — History &amp; Geography Learning</title>
<link rel="stylesheet" href="css/app.css?v=5">
</head>
<body>
<header id="app-header">
  <h1 id="app-title">Atlas</h1>
  <div class="controls">
    <label>
      <span data-i18n="lesson"></span>
      <select id="lesson-select"></select>
    </label>
    <label>
      <span data-i18n="mode"></span>
      <select id="mode-select">
        <option value="learn" data-i18n="mode_learn"></option>
        <option value="locate" data-i18n="mode_locate"></option>
        <option value="name" data-i18n="mode_name"></option>
      </select>
    </label>
    <label>
      <span data-i18n="language"></span>
      <select id="locale-select">
        <option value="en-GB">English (British)</option>
        <option value="fr-CA">Français (Canada)</option>
        <option value="zh-Hans">简体中文</option>
        <option value="zh-HK">繁體中文（香港）</option>
      </select>
    </label>
    <label id="answer-style-row" hidden>
      <span data-i18n="answer_style"></span>
      <select id="answer-style-select">
        <option value="choice" data-i18n="answer_choice"></option>
        <option value="text" data-i18n="answer_text"></option>
      </select>
    </label>
  </div>
</header>

<main>
  <section id="stage">
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="prompt-bar" hidden>
      <span id="prompt-text"></span>
      <span id="score-display"></span>
      <button id="restart-button" data-i18n="restart"></button>
    </div>
    <div id="answer-box" hidden>
      <div id="choices"></div>
      <form id="text-form" hidden>
        <input id="text-input" type="text" autocomplete="off" spellcheck="false">
        <button type="submit" data-i18n="submit"></button>
      </form>
    </div>
  </section>

  <aside id="info-panel" hidden>
    <button id="info-close" data-i18n="close" aria-label="close">×</button>
    <h2 id="info-name"></h2>
    <dl id="info-facts"></dl>
  </aside>
</main>

<footer id="hint-bar"><span id="hint-text"></span></footer>

<script src="js/vendor/topojson-client.min.js?v=3"></script>
<script src="js/vendor/d3-array.min.js?v=3"></script>
<script src="js/vendor/d3-path.min.js?v=3"></script>
<script src="js/vendor/d3-geo.min.js?v=3"></script>
<script src="js/i18n.js?v=3"></script>
<script src="js/map.js?v=6"></script>
<script src="js/app.js?v=3"></script>
</body>
</html>
